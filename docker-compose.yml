services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-me}
      ENABLE_DEMO_AUTH: ${ENABLE_DEMO_AUTH:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-retail-demo-local}
      CORS_ORIGIN: http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [retail]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [retail]

networks:
  retail:
    driver: bridge
