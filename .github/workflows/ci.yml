name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: bash scripts/test-integration.sh post
      - run: npm run build
      - run: docker compose config --quiet
        env:
          DATABASE_URL: postgresql://retail_api:ci_only@database.invalid:5432/retail
